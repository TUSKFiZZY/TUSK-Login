[project]
name = "tuskfizzy"
version = "2.0.1"
description = "TUSKFiZZY: personal Genshin Impact companion."
requires-python = ">=3.12,<3.13"
dependencies = [
    "genshin==1.7.31",
    "fastapi>=0.143,<0.144",
    "uvicorn>=0.54,<0.55",
    "truststore>=0.10.5,<0.11",
    "pillow>=11",
]

[project.scripts]
tuskfizzy = "guildboard.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "httpx2>=2.13,<3",
    "pytest-xdist>=3.6,<4",
]
package = [
    "pyinstaller>=6.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guildboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
