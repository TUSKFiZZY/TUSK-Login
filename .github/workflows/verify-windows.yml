name: Verify Windows

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            shell/package-lock.json

      - name: Install Python packages
        run: uv sync --frozen

      - name: Install web packages
        run: npm ci --prefix web

      - name: Install desktop shell packages
        run: npm ci --prefix shell

      - name: Test desktop shell
        run: npm test --prefix shell

      - name: Test Python core
        shell: powershell
        run: uv run --frozen python -m pytest -q -p no:cacheprovider

      - name: Test web interface
        working-directory: web
        run: npx vitest run

      - name: Build web interface for desktop E2E
        run: npm run build --prefix web

      - name: Test desktop end-to-end on Windows
        run: npm run e2e --prefix shell

      - name: Install Inno Setup if the image lacks it
        shell: pwsh
        run: |
          $places = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          )
          if (-not ($places | Where-Object { Test-Path -LiteralPath $_ })) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build the installer without publishing a release
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File build-installer.ps1

      - name: Write the installer's SHA-256
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem -LiteralPath dist-installer -Filter 'TUSKFiZZY Setup *.exe')
          if ($setup.Count -ne 1) {
            Write-Output "::error::dist-installer holds $($setup.Count) installers, and one was expected."
            exit 1
          }
          $hash = (Get-FileHash -LiteralPath $setup[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$($setup[0].FullName).sha256", "$hash  $($setup[0].Name)`n", (New-Object Text.UTF8Encoding $false))
          Write-Output "$hash  $($setup[0].Name)"

      - name: Keep the installer as a verification artifact only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tuskfizzy-installer-verification
          path: |
            dist-installer/TUSKFiZZY Setup *.exe
            dist-installer/TUSKFiZZY Setup *.exe.sha256
          if-no-files-found: error
          retention-days: 7
